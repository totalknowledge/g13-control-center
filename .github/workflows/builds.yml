name: Builds

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  PACKAGE_NAME: g13-control-center

jobs:
  version:
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v5

      - id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(sed -n '/^\[package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  debian-package:
    name: Debian package (${{ matrix.architecture }})
    needs: version

    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-26.04
          - architecture: arm64
            runner: ubuntu-26.04-arm

    runs-on: ${{ matrix.runner }}

    env:
      VERSION: ${{ needs.version.outputs.version }}

    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            appstream \
            desktop-file-utils \
            dpkg-dev \
            gir1.2-adw-1 \
            gir1.2-gtk-4.0 \
            gjs \
            udev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Debian package
        run: ./packaging/build-deb.sh

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: g13-control-center-${{ env.VERSION }}-${{ matrix.architecture }}
          path: dist/g13-control-center_${{ env.VERSION }}_${{ matrix.architecture }}.deb
          if-no-files-found: error

  source-archive:
    runs-on: ubuntu-26.04
    needs: version

    env:
      VERSION: ${{ needs.version.outputs.version }}

    steps:
      - uses: actions/checkout@v5

      - name: Build source archive
        run: |
          mkdir -p dist
          git archive \
            --format=tar.gz \
            --prefix="g13-control-center-${VERSION}/" \
            --output="dist/g13-control-center-${VERSION}.tar.gz" \
            HEAD

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: g13-control-center-${{ env.VERSION }}-source
          path: dist/g13-control-center-${{ env.VERSION }}.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - debian-package
      - source-archive

    runs-on: ubuntu-26.04

    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release/* \
            --generate-notes