  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - debian-package
      - source-archive

    runs-on: ubuntu-26.04

    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release/* \
            --repo "$GITHUB_REPOSITORY" \
            --generate-notes